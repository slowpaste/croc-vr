name: Publish source-only builder
on:
  push:
    tags: ['v1.0.*']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test engine/tools/*.test.cjs
      - name: Archive tracked source only
        run: |
          git archive --format=zip --prefix=croc-vr/ -o croc-vr-source.zip HEAD
          sha256sum croc-vr-source.zip > SHA256SUMS.txt
      - name: Publish builder source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" croc-vr-source.zip SHA256SUMS.txt --title "croc of slop VR $GITHUB_REF_NAME" --notes "Source code for the builder and game. Choose your own Croc PlayStation backup to build a headset app. Game files are not included."
